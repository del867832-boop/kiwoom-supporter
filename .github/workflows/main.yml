  name: kiwoom-supporter

  on:
    schedule:
      - cron: '30 23 * * 0-4'
    workflow_dispatch:

  jobs:
    generate-posts:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.11'
        - run: pip install pykrx pandas requests python-dotenv schedule
        - run: python kiwoom_supporter.py --now
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          env:
            TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          run: python kiwoom_supporter.py --now
